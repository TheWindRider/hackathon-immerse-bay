<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111a19" />
    <title>The Courtyard — WebXR</title>
  </head>
  <body>
    <main id="app">
      <canvas id="world" aria-label="A twilight courtyard garden"></canvas>
      <section id="welcome" class="welcome">
        <button id="start" type="button" disabled>Enter Courtyard</button>
      </section>
      <p id="status" class="status" role="status" hidden></p>
      <aside id="audio-controls" class="audio-controls" aria-label="Audio settings">
        <label for="volume">
          <span>Volume</span>
          <output id="volume-value" for="volume">100%</output>
        </label>
        <input id="volume" type="range" min="0" max="200" value="100" step="1" disabled />
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
